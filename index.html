<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e5"><title>SRM Day Order Calendar</title><link rel="stylesheet" href="style.css">
</head><body>
<header class="header"><div class="eyebrow">FET KATTANKULATHUR • SEMESTER 1</div><h1>Day Order Calendar</h1>
<p>Classes don't run Monday-to-Friday here — they run Day 1 through Day 5. Tap any date to see your complete schedule.</p>
<div class="today-card"><small>TODAY</small><strong id="todayLabel"></strong></div></header>
<main><section class="controls"><button id="prev">‹</button><h2 id="monthTitle"></h2><button id="next">›</button><button id="today" class="todayBtn">TODAY</button></section>
<div class="switch"><button class="active" id="monthBtn">▦ &nbsp; MONTH</button><button id="agendaBtn">☷ &nbsp; AGENDA</button></div>
<section id="calendar"></section><section id="agenda" class="hidden"></section>
<div class="legend"><span><i class="d1"></i>Day 1</span><span><i class="d2"></i>Day 2</span><span><i class="d3"></i>Day 3</span><span><i class="d4"></i>Day 4</span><span><i class="d5"></i>Day 5</span><span><i class="hd"></i>Holiday</span></div>
<div class="tracked">140 DAYS TRACKED • 2026-07-21 TO 2026-12-07</div></main>
<div id="sheet" class="sheet hidden"><div class="sheetPanel"><button id="closeSheet" class="close">×</button><div id="sheetContent"></div></div></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
